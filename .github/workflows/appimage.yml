# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: AppImage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+'
      - 'ci-test-**'
    paths:
      - packaging/appimage/**
      - .github/workflows/appimage.yml
      - packaging/CPackConfig.cmake
      - CMakeLists.txt
      - tools/linux_appimage_buildenv.sh

jobs:
  build:
    name: Build AppImage
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-26.04
            arch: x86_64
          # - name: Linux aarch64
          #   os: ubuntu-26.04-arm
          #   arch: aarch64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Ensure that all tags are fetched"
        run: git fetch origin --force --tags

      - name: "Install system dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache g++ make cmake pkg-config patchelf file \
            desktop-file-utils \
            libfuse2t64 unzip squashfs-tools \
            libsqlite3-dev libssl-dev libprotobuf-dev protobuf-compiler \
            libgl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-glx0-dev libxcb-cursor-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev libxcb-shm0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-util-dev libxcb-sync-dev libx11-xcb-dev libxrender-dev libxcb-xinput-dev libupower-glib-dev libsm-dev libxrandr-dev libxext-dev libudev-dev

      - name: "Install appimagetool"
        run: |
          curl -fsSL -o /tmp/appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x /tmp/appimagetool.AppImage
          # Extract the AppImage (Type 2) to get the native binary
          /tmp/appimagetool.AppImage --appimage-extract 2>/dev/null
          sudo mv squashfs-root/usr/bin/appimagetool /usr/local/bin/
          rm -rf squashfs-root /tmp/appimagetool.AppImage

      - name: "[Ubuntu/macOS] Restore ccache"
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/.cache/ccache
          key: ${{ matrix.os }}-appimage-qt6-ccache-${{ hashFiles('CMakeLists.txt', 'cmake/modules/FindSndFile.cmake', 'packaging/CPackConfig.cmake') }}
          restore-keys: |
            ${{ matrix.os }}-appimage-qt6-ccache-
            ${{ matrix.os }}-appimage-qt6-

      - name: "Set up ccache"
        run: |
          ccache --zero-stats
          ccache --max-size=4G
          # Add ccache compiler wrapper to PATH
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: "Get build environment name"
        run: source tools/linux_appimage_buildenv.sh name
        env:
          BUILDENV_BASEPATH: /home/runner/buildenv

      - name: "Restore build environment cache"
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/buildenv
          key: ${{ runner.os }}-buildenv-${{ env.BUILDENV_NAME }}

      - name: "Validate buildenv cache"
        run: |
          if [ -d "/home/runner/buildenv" ]; then
            VCPKG_CMAKE=$(find /home/runner/buildenv -name "vcpkg.cmake" -type f -path "*/scripts/buildsystems/*" 2>/dev/null | head -1)
            if [ -z "$VCPKG_CMAKE" ]; then
              echo "Buildenv cache is corrupted (vcpkg.cmake not found), clearing cache"
              rm -rf /home/runner/buildenv
            else
              echo "Buildenv cache is valid, vcpkg.cmake found at: ${VCPKG_CMAKE}"
            fi
          fi

      - name: "Set up build environment"
        run: source tools/linux_appimage_buildenv.sh setup
        env:
          BUILDENV_BASEPATH: /home/runner/buildenv

      - name: "Create FindXKB.cmake for buildenv compatibility"
        run: |
          mkdir -p /tmp/xkb-cmake
          python3 -c "
          content = '''if(NOT TARGET XKB::XKB)
            find_package(PkgConfig QUIET)
            if(PkgConfig_FOUND)
              pkg_check_modules(xkbcommon IMPORTED_TARGET xkbcommon)
              if(xkbcommon_FOUND)
                add_library(XKB::XKB ALIAS PkgConfig::xkbcommon)
                set(XKB_FOUND TRUE)
                set(XKB_LIBRARY \${xkbcommon_LIBRARIES})
                set(XKB_INCLUDE_DIR \${xkbcommon_INCLUDE_DIRS})
                set(XKB_VERSION \${xkbcommon_VERSION})
              endif()
            endif()
          endif()
          if(NOT XKB_FOUND)
            find_path(XKB_INCLUDE_DIR xkbcommon/xkbcommon.h)
            find_library(XKB_LIBRARY xkbcommon)
            if(XKB_INCLUDE_DIR AND XKB_LIBRARY)
              set(XKB_FOUND TRUE)
            endif()
          endif()
          if(XKB_FOUND)
            if(NOT TARGET XKB::XKB)
              add_library(XKB::XKB UNKNOWN IMPORTED)
              set_target_properties(XKB::XKB PROPERTIES
                IMPORTED_LOCATION \"\${XKB_LIBRARY}\"
                INTERFACE_INCLUDE_DIRECTORIES \"\${XKB_INCLUDE_DIR}\"
              )
            endif()
          endif()
          mark_as_advanced(XKB_LIBRARY XKB_INCLUDE_DIR)
          '''
          with open('/tmp/xkb-cmake/FindXKB.cmake', 'w') as f:
              f.write(content)
          print('FindXKB.cmake created')
          "

      - name: "Configure"
        run: |
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_MODULE_PATH="/tmp/xkb-cmake" \
            -DQT6=ON \
            -DQML=ON \
            -DINSTALL_USER_UDEV_RULES=OFF \
            -DWARNINGS_FATAL=OFF \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g -DNDEBUG"

      - name: "Build"
        run: cmake --build build -j$(nproc)

      - name: "Package"
        run: |
          set -o pipefail
          # Install to staging AppDir using absolute prefix path
          cmake --install build --prefix "$(pwd)/build/staging"
          # Copy icon to AppDir root for appimagetool
          cp build/staging/share/icons/hicolor/256x256/apps/mixxx.png build/staging/.DirIcon
          # Run appimagetool (native binary, no FUSE needed)
          /usr/local/bin/appimagetool -v build/staging build/Mixxx-x86_64.AppImage
          # List output files for debugging
          ls -la build/Mixxx-*.AppImage 2>/dev/null || echo "No AppImage file found in build/"
        working-directory: .

      - name: "Upload AppImage"
        uses: actions/upload-artifact@v4
        with:
          name: Mixxx-AppImage-${{ matrix.arch }}
          path: build/*.AppImage
          if-no-files-found: error

      - name: "Save ccache"
        if: always()
        uses: actions/cache/save@v6
        with:
          path: /home/runner/.cache/ccache
          key: ${{ matrix.os }}-appimage-qt6-ccache-${{ hashFiles('CMakeLists.txt', 'cmake/modules/FindSndFile.cmake', 'packaging/CPackConfig.cmake') }}

      - name: "Save build environment cache"
        if: always()
        uses: actions/cache/save@v6
        with:
          path: /home/runner/buildenv
          key: ${{ runner.os }}-buildenv-${{ env.BUILDENV_NAME }}