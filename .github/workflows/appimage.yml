# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: AppImage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+'
      - 'ci-test-**'
    paths:
      - packaging/appimage/**
      - .github/workflows/appimage.yml
      - packaging/CPackConfig.cmake
      - CMakeLists.txt
      - tools/linux_appimage_buildenv.sh

jobs:
  build:
    name: Build AppImage
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-26.04
            arch: x86_64
          # - name: Linux aarch64
          #   os: ubuntu-26.04-arm
          #   arch: aarch64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Ensure that all tags are fetched"
        run: git fetch origin --force --tags

      - name: "Install system dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache g++ make cmake pkg-config patchelf file \
            desktop-file-utils \
            libfuse2t64 unzip

      - name: "Install appimagetool"
        run: |
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/

      - name: "[Ubuntu/macOS] Set up GitHub cache for ccache"
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/ccache
          key: ${{ matrix.os }}-appimage-qt6-${{ github.run_number }}
          restore-keys: |
            ${{ matrix.os }}-appimage-qt6

      - name: "Set up ccache"
        run: |
          ccache --zero-stats
          ccache --max-size=2G

      - name: "Get build environment name"
        run: source tools/linux_appimage_buildenv.sh name
        env:
          BUILDENV_BASEPATH: /home/runner/buildenv

      - name: "Set up build environment cache"
        uses: actions/cache@v6
        with:
          path: /home/runner/buildenv
          key: ${{ runner.os }}-buildenv-${{ env.BUILDENV_NAME }}

      - name: "Download buildenv"
        if: ${{ runner.os == 'Linux' }}
        run: |
          source tools/linux_appimage_buildenv.sh name
          BUILDENV_NAME="${BUILDENV_NAME:-mixxx-deps-2.7-x64-linux-1c20f84a}"
          BUILDENV_PATH="/home/runner/buildenv/${BUILDENV_NAME}"
          if [ ! -d "$BUILDENV_PATH" ]; then
            BUILDENV_URL="https://downloads.mixxx.org/dependencies/2.7/Linux/${BUILDENV_NAME}.zip"
            echo "Downloading ${BUILDENV_URL} ..."
            curl -fsSL -o "/tmp/${BUILDENV_NAME}.zip" "$BUILDENV_URL"
            ls -la "/tmp/${BUILDENV_NAME}.zip"
            echo "Extracting ..."
            mkdir -p "/home/runner/buildenv"
            unzip -o "/tmp/${BUILDENV_NAME}.zip" -d "/home/runner/buildenv/"
            echo "Buildenv downloaded and extracted to ${BUILDENV_PATH}"
            ls -la "${BUILDENV_PATH}/"
          else
            echo "Buildenv already exists at ${BUILDENV_PATH}"
          fi
          # Verify vcpkg root
          if [ -f "${BUILDENV_PATH}/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "Vcpkg root verified at ${BUILDENV_PATH}"
          elif [ -f "${BUILDENV_PATH}/vcpkg/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "Vcpkg root found inside vcpkg/ subdirectory"
            echo "MIXXX_VCPKG_ROOT=${BUILDENV_PATH}/vcpkg" >> "${GITHUB_ENV}"
          else
            echo "Warning: Could not find vcpkg.cmake in expected locations"
            find "${BUILDENV_PATH}" -name "vcpkg.cmake" -type f 2>/dev/null || echo "No vcpkg.cmake found anywhere in buildenv"
            echo "Buildenv top-level contents:"
            ls -la "${BUILDENV_PATH}/" 2>/dev/null || echo "BUILDENV_PATH does not exist"
            echo "Buildenv base contents:"
            ls -la /home/runner/buildenv/ 2>/dev/null
          fi
        env:
          BUILDENV_BASEPATH: /home/runner/buildenv

      - name: "Debug buildenv"
        run: |
          echo "BUILDENV_NAME: ${BUILDENV_NAME}"
          echo "MIXXX_VCPKG_ROOT: ${MIXXX_VCPKG_ROOT}"
          echo "Buildenv path contents:"
          ls -la /home/runner/buildenv/
          if [ -n "${MIXXX_VCPKG_ROOT}" ]; then
            echo "MIXXX_VCPKG_ROOT contents:"
            ls -la "${MIXXX_VCPKG_ROOT}/" 2>/dev/null || echo "Does not exist"
            echo "Searching for vcpkg.cmake in MIXXX_VCPKG_ROOT:"
            find "${MIXXX_VCPKG_ROOT}" -name "vcpkg.cmake" -type f 2>/dev/null || echo "Not found"
          fi
          echo "Searching for vcpkg.cmake in buildenv:"
          find /home/runner/buildenv -name "vcpkg.cmake" -type f 2>/dev/null || echo "Not found"

      - name: "Set up build environment"
        run: source tools/linux_appimage_buildenv.sh setup
        env:
          BUILDENV_BASEPATH: /home/runner/buildenv

      - name: "Configure"
        run: |
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DQT6=ON \
            -DQML=ON \
            -DINSTALL_USER_UDEV_RULES=OFF \
            -DWARNINGS_FATAL=OFF \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g -DNDEBUG"

      - name: "Build"
        run: cmake --build build -j$(nproc)

      - name: "Package"
        run: cpack -G AppImage -V
        working-directory: build

      - name: "Upload AppImage"
        uses: actions/upload-artifact@v4
        with:
          name: Mixxx-AppImage-${{ matrix.arch }}
          path: build/*.AppImage
          if-no-files-found: error