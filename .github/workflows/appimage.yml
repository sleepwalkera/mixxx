# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: AppImage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+'
      - 'ci-test-**'
    paths:
      - packaging/appimage/**
      - .github/workflows/appimage.yml
      - packaging/CPackConfig.cmake
      - CMakeLists.txt
      - tools/linux_appimage_buildenv.sh

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppImage Linux x86_64
            os: ubuntu-26.04
            arch: x86_64
            buildenv_basepath: /home/runner/buildenv
            buildenv_script: tools/linux_appimage_buildenv.sh
            compiler_cache: ccache
            compiler_cache_path: /home/runner/.cache/ccache
            compiler_cache_id: appimage-qt6
            artifacts_name: Mixxx AppImage
            artifacts_path: build/*.AppImage
            artifacts_slug: appimage-linux
          # - name: AppImage Linux aarch64
          #   os: ubuntu-26.04-arm
          #   arch: aarch64
          #   buildenv_basepath: /home/runner/buildenv
          #   buildenv_script: tools/linux_appimage_buildenv.sh
          #   compiler_cache: ccache
          #   compiler_cache_path: /home/runner/.cache/ccache
          #   compiler_cache_id: appimage-qt6
          #   artifacts_name: Mixxx AppImage
          #   artifacts_path: build/*.AppImage
          #   artifacts_slug: appimage-linux-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Ensure that all tags are fetched"
        run: git fetch origin --force --tags

      - name: "[Linux] Install system dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache g++ make cmake pkg-config patchelf file \
            desktop-file-utils \
            libfuse2t64 libgpgme11t64 unzip squashfs-tools \
            libsqlite3-dev libssl-dev libprotobuf-dev protobuf-compiler \
            libgl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-glx0-dev libxcb-cursor-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev libxcb-shm0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-util-dev libxcb-sync-dev \
            libx11-xcb-dev libxrender-dev libxcb-xinput-dev \
            libupower-glib-dev libsm-dev libxrandr-dev \
            libxext-dev libudev-dev

      - name: "[Linux] Install appimagetool"
        run: packaging/appimage/install-appimagetool.sh ${{ matrix.arch }}

      - name: "[Linux] Get build environment name"
        run: ${{ matrix.buildenv_script }} name
        env:
          BUILDENV_BASEPATH: ${{ matrix.buildenv_basepath }}

      - name: "[Linux] Restore build environment cache"
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.buildenv_basepath }}
          key: ${{ runner.os }}-buildenv-${{ env.BUILDENV_NAME }}

      - name: "[Linux] Validate build environment cache"
        run: |
          if [ -d "${{ matrix.buildenv_basepath }}" ]; then
            VCPKG_CMAKE=$(find "${{ matrix.buildenv_basepath }}" -name "vcpkg.cmake" -type f -path "*/scripts/buildsystems/*" 2>/dev/null | head -1)
            if [ -z "${VCPKG_CMAKE}" ]; then
              echo "Buildenv cache is corrupted (vcpkg.cmake not found), clearing cache"
              rm -rf "${{ matrix.buildenv_basepath }}"
            else
              echo "Buildenv cache is valid, vcpkg.cmake found at: ${VCPKG_CMAKE}"
            fi
          fi

      - name: "[Linux] Set up build environment"
        run: ${{ matrix.buildenv_script }} setup
        env:
          BUILDENV_BASEPATH: ${{ matrix.buildenv_basepath }}

      - name: "[Linux] Set up GitHub cache for ccache"
        uses: actions/cache@v6
        with:
          path: ${{ matrix.compiler_cache_path }}
          key: ${{ matrix.os }}-${{ matrix.compiler_cache_id }}-${{ hashFiles('CMakeLists.txt', 'cmake/modules/FindSndFile.cmake', 'packaging/CPackConfig.cmake') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.compiler_cache_id }}-
            ${{ matrix.os }}-${{ matrix.compiler_cache_id }}-

      - name: "[Linux] Set up ccache"
        run: |
          ${{ matrix.compiler_cache }} --zero-stats
          ${{ matrix.compiler_cache }} --max-size=4G

      - name: "Configure"
        run: |
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_MODULE_PATH="${GITHUB_WORKSPACE}/packaging/appimage" \
            -DQT6=ON \
            -DQML=ON \
            -DINSTALL_USER_UDEV_RULES=OFF \
            -DWARNINGS_FATAL=OFF \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG" \
            -DCMAKE_INSTALL_PREFIX=/

      - name: "Build"
        run: cmake --build build -j$(nproc)

      - name: "[Linux] Print compiler cache stats"
        run: |
          ${{ matrix.compiler_cache }} --show-stats
          ${{ matrix.compiler_cache }} --cleanup

      - name: "Package"
        run: packaging/appimage/build-appimage.sh build ${{ matrix.arch }}

      - name: "[Linux] Upload AppImage"
        uses: actions/upload-artifact@v4
        with:
          name: Mixxx-AppImage-${{ matrix.arch }}
          path: ${{ matrix.artifacts_path }}
          if-no-files-found: error

      - name: "[Linux] Save ccache"
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.compiler_cache_path }}
          key: ${{ matrix.os }}-${{ matrix.compiler_cache_id }}-${{ hashFiles('CMakeLists.txt', 'cmake/modules/FindSndFile.cmake', 'packaging/CPackConfig.cmake') }}

      - name: "[Linux] Save build environment cache"
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.buildenv_basepath }}
          key: ${{ runner.os }}-buildenv-${{ env.BUILDENV_NAME }}