# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: AppImage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+'
      - 'ci-test-**'
    paths:
      - packaging/appimage/**
      - .github/workflows/appimage.yml
      - packaging/CPackConfig.cmake
      - CMakeLists.txt

jobs:
  build:
    name: Build AppImage
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-26.04
            arch: x86_64
          # - name: Linux aarch64
          #   os: ubuntu-26.04-arm
          #   arch: aarch64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Ensure that all tags are fetched"
        run: git fetch origin --force --tags

      - name: "Install system dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache g++ make cmake pkg-config patchelf file \
            desktop-file-utils libxkbcommon-dev libegl1-mesa-dev \
            libxkbcommon-x11-dev \
            qt6-base-dev libqt6svg6-dev qt6-multimedia-dev qt6-declarative-dev \
            qt6-shadertools-dev \
            qt6-5compat-dev \
            qt6-base-private-dev \
            qt6-declarative-private-dev \
            libavformat-dev libebur128-dev libfaad-dev libfftw3-dev \
            libflac-dev libmad0-dev libmodplug-dev libmp3lame-dev \
            libopus-dev libopusfile-dev libportmidi-dev libsndfile1-dev \
            libsoundtouch-dev libtag1-dev libwavpack-dev libchromaprint-dev \
            librubberband-dev libshout-idjc-dev libhidapi-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev portaudio19-dev liblilv-dev lv2-dev \
            libssl-dev libsqlite3-dev libupower-glib-dev protobuf-compiler \
            libprotobuf-dev libgmock-dev libgtest-dev libbenchmark-dev \
            libgl1-mesa-dev qtkeychain-qt6-dev libid3tag0-dev libmsgsl-dev \
            libfuse2t64 fonts-open-sans \
            qt6-svg-plugins \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-shapes \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qt-labs-qmlmodels \
            qml6-module-qt-labs-folderlistmodel \
            qml6-module-qtmultimedia

      - name: "Install appimagetool"
        run: |
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/

      - name: "Download linuxdeploy"
        run: |
          curl -fsSL -o /tmp/linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage"
          curl -fsSL -o /tmp/linuxdeploy-plugin-qt \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.arch }}.AppImage"
          chmod +x /tmp/linuxdeploy /tmp/linuxdeploy-plugin-qt

      - name: "Configure"
        run: |
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DQT6=ON \
            -DQML=ON \
            -DINSTALL_USER_UDEV_RULES=OFF \
            -DWARNINGS_FATAL=OFF \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g -DNDEBUG"

      - name: "Build"
        run: cmake --build build -j$(nproc)

      - name: "Install to staging directory"
        run: |
          cmake --install build --prefix /tmp/AppDir/usr --config RelWithDebInfo
          # Install controller QML files (not handled by cmake --install)
          mkdir -p /tmp/AppDir/usr/share/mixxx/controllers
          cp -r res/controllers/* /tmp/AppDir/usr/share/mixxx/controllers/

      - name: "Bundle dependencies and create AppImage"
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QML_SOURCES_PATHS=/tmp/AppDir/usr/share/mixxx/qml
          export QML_IMPORT_PATHS=/tmp/AppDir/usr/share/mixxx/qml:/tmp/AppDir/usr/share/mixxx/controllers/TraktorKontrolS4MK3Screens
          export QML_IMPORT_PATHS=/tmp/AppDir/usr/share/mixxx/controllers
          /tmp/linuxdeploy --appdir /tmp/AppDir \
            --executable /tmp/AppDir/usr/bin/mixxx \
            --desktop-file /tmp/AppDir/usr/share/applications/mixxx-appimage.desktop \
            --icon-file /tmp/AppDir/usr/share/icons/hicolor/256x256/apps/mixxx.png \
            --plugin qt
          GIT_DESCRIBE=$(git describe --tags --always 2>/dev/null || echo "unknown")
          appimagetool --no-appstream /tmp/AppDir \
            "build/mixxx-${GIT_DESCRIBE}-${{ matrix.arch }}.AppImage"

      - name: "Upload AppImage"
        uses: actions/upload-artifact@v4
        with:
          name: Mixxx-AppImage-${{ matrix.arch }}
          path: build/*.AppImage
          if-no-files-found: error