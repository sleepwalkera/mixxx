# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: AppImage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+'
      - 'ci-test-**'
    paths:
      - packaging/appimage/**
      - .github/workflows/appimage.yml
      - packaging/CPackConfig.cmake
      - CMakeLists.txt
      - tools/linux_appimage_buildenv.sh

jobs:
  build:
    name: Build AppImage
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-26.04
            arch: x86_64
          # - name: Linux aarch64
          #   os: ubuntu-26.04-arm
          #   arch: aarch64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Ensure that all tags are fetched"
        run: git fetch origin --force --tags

      - name: "Install system dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache g++ make cmake pkg-config patchelf file \
            desktop-file-utils \
            libfuse2t64 unzip \
            libsqlite3-dev libssl-dev libprotobuf-dev protobuf-compiler \
            libgl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-glx0-dev libxcb-cursor-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev libxcb-shm0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-util-dev libxcb-sync-dev libx11-xcb-dev

      - name: "Install appimagetool"
        run: |
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/

      - name: "[Ubuntu/macOS] Set up GitHub cache for ccache"
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/ccache
          key: ${{ matrix.os }}-appimage-qt6-${{ github.run_number }}
          restore-keys: |
            ${{ matrix.os }}-appimage-qt6

      - name: "Set up ccache"
        run: |
          ccache --zero-stats
          ccache --max-size=2G

      - name: "Get build environment name"
        run: source tools/linux_appimage_buildenv.sh name
        env:
          BUILDENV_BASEPATH: /home/runner/buildenv

      - name: "Set up build environment cache"
        uses: actions/cache@v6
        with:
          path: /home/runner/buildenv
          key: ${{ runner.os }}-buildenv-${{ env.BUILDENV_NAME }}

      - name: "Validate buildenv cache"
        run: |
          if [ -d "/home/runner/buildenv" ]; then
            VCPKG_CMAKE=$(find /home/runner/buildenv -name "vcpkg.cmake" -type f -path "*/scripts/buildsystems/*" 2>/dev/null | head -1)
            if [ -z "$VCPKG_CMAKE" ]; then
              echo "Buildenv cache is corrupted (vcpkg.cmake not found), clearing cache"
              rm -rf /home/runner/buildenv
            else
              echo "Buildenv cache is valid, vcpkg.cmake found at: ${VCPKG_CMAKE}"
            fi
          fi

      - name: "Set up build environment"
        run: source tools/linux_appimage_buildenv.sh setup
        env:
          BUILDENV_BASEPATH: /home/runner/buildenv

      - name: "Create FindXKB.cmake for buildenv compatibility"
        run: |
          mkdir -p /tmp/xkb-cmake
          python3 -c "
          content = '''if(NOT TARGET xkbcommon::xkbcommon)
            find_package(PkgConfig QUIET)
            if(PkgConfig_FOUND)
              pkg_check_modules(xkbcommon IMPORTED_TARGET xkbcommon)
              if(xkbcommon_FOUND)
                add_library(xkbcommon::xkbcommon ALIAS PkgConfig::xkbcommon)
                set(XKB_FOUND TRUE)
                set(XKB_LIBRARY \${xkbcommon_LIBRARIES})
                set(XKB_INCLUDE_DIR \${xkbcommon_INCLUDE_DIRS})
                set(XKB_VERSION \${xkbcommon_VERSION})
              endif()
            endif()
          endif()
          if(NOT XKB_FOUND)
            find_path(XKB_INCLUDE_DIR xkbcommon/xkbcommon.h)
            find_library(XKB_LIBRARY xkbcommon)
            if(XKB_INCLUDE_DIR AND XKB_LIBRARY)
              set(XKB_FOUND TRUE)
            endif()
          endif()
          if(XKB_FOUND)
            if(NOT TARGET xkbcommon::xkbcommon)
              add_library(xkbcommon::xkbcommon UNKNOWN IMPORTED)
              set_target_properties(xkbcommon::xkbcommon PROPERTIES
                IMPORTED_LOCATION \"\${XKB_LIBRARY}\"
                INTERFACE_INCLUDE_DIRECTORIES \"\${XKB_INCLUDE_DIR}\"
              )
            endif()
          endif()
          mark_as_advanced(XKB_LIBRARY XKB_INCLUDE_DIR)
          '''
          with open('/tmp/xkb-cmake/FindXKB.cmake', 'w') as f:
              f.write(content)
          print('FindXKB.cmake created')
          "

      - name: "Configure"
        run: |
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_MODULE_PATH="/tmp/xkb-cmake" \
            -DQT6=ON \
            -DQML=ON \
            -DINSTALL_USER_UDEV_RULES=OFF \
            -DWARNINGS_FATAL=OFF \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g -DNDEBUG"

      - name: "Build"
        run: cmake --build build -j$(nproc)

      - name: "Package"
        run: cpack -G AppImage -V
        working-directory: build

      - name: "Upload AppImage"
        uses: actions/upload-artifact@v4
        with:
          name: Mixxx-AppImage-${{ matrix.arch }}
          path: build/*.AppImage
          if-no-files-found: error